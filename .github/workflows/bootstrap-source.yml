name: Publish competition source tree

on:
  push:
    paths:
      - '.bootstrap/source.part*'
      - '.github/workflows/bootstrap-source.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part* > /tmp/source.tar.gz.b64
          base64 --decode /tmp/source.tar.gz.b64 > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Mark binary assets as pending
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          notice = '''\n## 실행용 바이너리 자산\n\n소스코드와 모델 메타데이터는 공개되어 있습니다. 실행용 `.tflite` 모델과 안내용 `.wav` 파일은 장치에서 사용하는 최종 자산을 별도 커밋으로 추가합니다. 자산 추가 전에도 전체 프로그램 구조와 제어 로직을 검토할 수 있습니다.\n'''
          marker = '\n## 하드웨어\n'
          if notice.strip() not in text and marker in text:
              text = text.replace(marker, notice + marker, 1)
          readme.write_text(text, encoding='utf-8')

          submission = Path('SUBMISSION.md')
          text = submission.read_text(encoding='utf-8')
          text = text.replace('- [x] TFLite 모델 및 라벨 포함', '- [ ] TFLite 모델 바이너리 추가')
          text = text.replace('- [x] 음성 WAV 포함', '- [ ] 음성 WAV 추가')
          submission.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/validate.yml')
          workflow.write_text('''name: Validate source\n\non:\n  push:\n  pull_request:\n\njobs:\n  syntax:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.11"\n      - name: Compile Python source\n        run: python -m compileall -q .\n      - name: Check required source files\n        run: |\n          test -f smart_bin_final.py\n          test -f smart_bin_camera_ai.py\n          test -f smart_bin_hardware.py\n          test -f hardware_config.json\n          test -f model/model_metadata.json\n          test -f model/pet_plastic_metadata.json\n''', encoding='utf-8')
          PY

      - name: Commit published source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish competition source code and documentation'
          git push
